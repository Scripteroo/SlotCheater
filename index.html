    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: #0B0B0D; color: #e5e5e5; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body { min-height: 100vh; min-height: 100svh; padding-bottom: 84px; }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; cursor: pointer; }

        #app { max-width: 1100px; margin: 0 auto; padding: 24px 16px 8px; }

        .view { animation: fadeIn 0.18s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* HOME */
        .view-home { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 130px); min-height: calc(100svh - 130px); padding: 16px 0; }
        .hero { text-align: center; max-width: 560px; }
        .hero h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, #8B5CF6 0%, #F59E0B 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
        .hero .tagline { font-size: 1.15rem; font-weight: 600; color: #f5f5f5; margin-bottom: 16px; line-height: 1.4; }
        .hero .explainer { font-size: 0.95rem; color: #a0a0a0; line-height: 1.6; margin-bottom: 24px; }
        .cta { display: inline-block; padding: 14px 28px; background: #8B5CF6; color: #fff; font-weight: 700; font-size: 1rem; border-radius: 10px; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3); }
        .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(139, 92, 246, 0.45); }
        .footnote { margin-top: 28px; font-size: 0.8rem; color: #707070; }

        /* VIEW HEADER (shared) */
        .view-header { margin-bottom: 20px; }
        .view-header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; color: #fff; margin-bottom: 4px; }
        .view-header p { font-size: 0.9rem; color: #a0a0a0; }

        /* CARD GRID */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }

        .card { background: rgba(20, 20, 26, 0.85); border: 1px solid rgba(139, 92, 246, 0.18); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; transition: border-color 0.15s, transform 0.15s; }
        .card:hover { border-color: rgba(139, 92, 246, 0.5); transform: translateY(-2px); }
        .card-thumb { width: 100%; aspect-ratio: 1 / 1; background: rgba(139, 92, 246, 0.08); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .card-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .card-thumb-fallback { font-size: 3rem; line-height: 1; }
        .card-name { font-size: 0.95rem; font-weight: 600; color: #fff; margin-bottom: 10px; min-height: 2.6em; line-height: 1.3; }
        .card-cta { margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; border: 1.5px solid #F59E0B; border-radius: 6px; color: #F59E0B; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; transition: background 0.15s, color 0.15s; }
        .card-cta:hover { background: #F59E0B; color: #0B0B0D; }
        .card-cta span { letter-spacing: -0.05em; font-weight: 400; }

        /* NOT-AP */
        .grid-notap { grid-template-columns: 1fr; }
        @media (min-width: 720px) { .grid-notap { grid-template-columns: repeat(2, 1fr); } }
        .card-notap { border-color: rgba(239, 68, 68, 0.3); }
        .card-notap:hover { border-color: rgba(239, 68, 68, 0.6); }
        .card-notap .card-name { color: #f87171; min-height: auto; margin-bottom: 12px; }
        .card-notap .card-cta { border-color: #f87171; color: #f87171; }
        .card-notap .card-cta:hover { background: #f87171; color: #0B0B0D; }
        .education-link { display: block; margin-top: 24px; padding: 14px 16px; text-align: center; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 8px; color: #F59E0B; font-weight: 600; font-size: 0.9rem; transition: background 0.15s; }
        .education-link:hover { background: rgba(245, 158, 11, 0.18); }

        /* STATES */
        .state-loading, .state-error { padding: 60px 16px; text-align: center; color: #a0a0a0; }
        .spinner { width: 36px; height: 36px; margin: 0 auto 16px; border: 3px solid rgba(139, 92, 246, 0.2); border-top-color: #8B5CF6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .state-error h2 { color: #f87171; font-size: 1.1rem; margin-bottom: 8px; }
        .state-error button { margin-top: 16px; padding: 10px 20px; background: #8B5CF6; color: #fff; border: 0; border-radius: 8px; font-weight: 600; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; padding-bottom: env(safe-area-inset-bottom); background: rgba(11, 11, 13, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(139, 92, 246, 0.2); display: flex; z-index: 50; }
        .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #707070; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; transition: color 0.15s; }
        .bottom-nav a .nav-icon { font-size: 1.25rem; line-height: 1; }
        .bottom-nav a.active { color: #8B5CF6; }
        .bottom-nav a.active .nav-icon { filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.6)); }
        .bottom-nav a:hover { color: #a78bfa; }
    </style>
</head>
<body>
    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Primary">
        <a href="#home" data-tab="home"><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="#cheats" data-tab="cheats"><span class="nav-icon">🎰</span><span>Cheats</span></a>
        <a href="#not-ap" data-tab="not-ap"><span class="nav-icon">🚫</span><span>Not-AP</span></a>
    </nav>

    <script>
        (function () {
            'use strict';

            var TABS = ['home', 'cheats', 'not-ap'];
            var DEFAULT_TAB = 'cheats';
            var DATA_URL = '/machines.json';

            var machinesData = null;
            var fetchPromise = null;
            var fetchError = null;

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function loadMachines() {
                if (machinesData) return Promise.resolve(machinesData);
                if (fetchPromise) return fetchPromise;
                fetchPromise = fetch(DATA_URL, { cache: 'no-cache' })
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (data) {
                        machinesData = data;
                        fetchError = null;
                        return data;
                    })
                    .catch(function (err) {
                        fetchError = err;
                        fetchPromise = null;
                        throw err;
                    });
                return fetchPromise;
            }

            function renderHome() {
                return ''
                    + '<section class="view view-home">'
                    + '  <div class="hero">'
                    + '    <h1>🎰 SlotCheater.com</h1>'
                    + '    <p class="tagline">Know which slots are beatable — before you sit down.</p>'
                    + '    <p class="explainer">Advantage play means finding machines where the math is temporarily in your favor. Our cheat sheets show you exactly what to look for.</p>'
                    + '    <a href="#cheats" class="cta">Browse Cheat Sheets →</a>'
                    + '    <p class="footnote">Always gamble responsibly. AP is legal but requires practice.</p>'
                    + '  </div>'
                    + '</section>';
            }

            function renderCheats() {
                var ap = machinesData.ap.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
                var cards = ap.map(function (m) {
                    return ''
                        + '<article class="card">'
                        + '  <div class="card-thumb">'
                        + '    <img src="/' + escapeHtml(m.thumb) + '" alt="' + escapeHtml(m.name) + '" loading="lazy" onerror="this.outerHTML=\'<div class=\\\'card-thumb-fallback\\\'>🎰</div>\'">'
                        + '  </div>'
                        + '  <h3 class="card-name">' + escapeHtml(m.name) + '</h3>'
                        + '  <a class="card-cta" href="/hunter/' + escapeHtml(m.slug) + '/">Cheat Sheet <span>›››</span></a>'
                        + '</article>';
                }).join('');
                return ''
                    + '<section class="view view-cheats">'
                    + '  <header class="view-header">'
                    + '    <h1>🎰 Cheat Sheets</h1>'
                    + '    <p>' + ap.length + ' confirmed advantage-play machines</p>'
                    + '  </header>'
                    + '  <div class="grid">' + cards + '</div>'
                    + '</section>';
            }

            function renderNotAp() {
                var items = machinesData.notAp.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
                var cards = items.map(function (m) {
                    return ''
                        + '<article class="card card-notap">'
                        + '  <h3 class="card-name">🚫 ' + escapeHtml(m.name) + '</h3>'
                        + '  <a class="card-cta" href="/hunter/not-ap/' + escapeHtml(m.slug) + '/">Why not AP →</a>'
                        + '</article>';
                }).join('');
                return ''
                    + '<section class="view view-notap">'
                    + '  <header class="view-header">'
                    + '    <h1>🚫 NOT Advantage-Play</h1>'
                    + '    <p>These machines look similar but don\'t have a beatable edge. Here\'s why.</p>'
                    + '  </header>'
                    + '  <div class="grid grid-notap">' + cards + '</div>'
                    + '  <a class="education-link" href="/hunter/not-ap/why-modern-slots-arent-ap/">Why most modern slots aren\'t AP →</a>'
                    + '</section>';
            }

            function renderLoading() {
                return '<section class="view"><div class="state-loading"><div class="spinner"></div><p>Loading…</p></div></section>';
            }

            function renderError(msg) {
                return ''
                    + '<section class="view">'
                    + '  <div class="state-error">'
                    + '    <h2>Couldn\'t load cheat sheets</h2>'
                    + '    <p>' + escapeHtml(msg) + '</p>'
                    + '    <button onclick="location.reload()">Retry</button>'
                    + '  </div>'
                    + '</section>';
            }

            function getCurrentTab() {
                var hash = window.location.hash.replace(/^#/, '');
                return TABS.indexOf(hash) !== -1 ? hash : DEFAULT_TAB;
            }

            function setActiveTab(tab) {
                var links = document.querySelectorAll('.bottom-nav a');
                for (var i = 0; i < links.length; i++) {
                    var isActive = links[i].getAttribute('data-tab') === tab;
                    if (isActive) links[i].classList.add('active');
                    else links[i].classList.remove('active');
                }
            }

            function render() {
                var tab = getCurrentTab();
                var app = document.getElementById('app');
                setActiveTab(tab);

                if (tab === 'home') {
                    app.innerHTML = renderHome();
                    window.scrollTo(0, 0);
                    return;
                }

                if (machinesData) {
                    app.innerHTML = tab === 'cheats' ? renderCheats() : renderNotAp();
                    window.scrollTo(0, 0);
                    return;
                }

                if (fetchError) {
                    app.innerHTML = renderError(fetchError.message);
                    return;
                }

                app.innerHTML = renderLoading();
                loadMachines().then(render).catch(function () { render(); });
            }

            // Default to #cheats on first load if no hash present
            if (!window.location.hash) {
                history.replaceState(null, '', '#' + DEFAULT_TAB);
            }

            window.addEventListener('hashchange', render);
            render();

            // PWA service worker registration
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('/sw.js').catch(function () { /* ignore */ });
                });
            }
        })();
    </script>
</body>
</html>
