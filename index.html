    <script>
        (function () {
            'use strict';

            // ---------- Constants ----------
            var TABS = ['home', 'cheats', 'videos', 'play', 'chat'];
            var DEFAULT_TAB = 'cheats';

            var QUIZ_QUESTIONS = [
                {
                    text: "A slot machine's coin meter shows 97 out of 100 coins collected. What do you do?",
                    answers: [
                        "Walk away — it might never fill",

                {

                        "A random scatter bonus",
                        "A must-hit-by jackpot under $500",
                        "A 10-spin cycle where wild reels are tracked — play if cycles are loaded",
                        "A free spin meter that resets daily"
                    ],
                    correct: 2,

                {

                    ],
                    correct: 1,
                    explanation: "Banking slots carry forward progress. The previous player did the work; you collect the reward."
                },
                {
                    text: "Golden Egypt and Ocean Magic are made by which manufacturer?",
                    answers: ["Aristocrat", "Konami", "WMS", "IGT"],
                    correct: 3,
                    explanation: "IGT (International Game Technology) makes most of the classic AP banking games including Golden Egypt, Ocean Magic, Scarab, and Golden Jungle."
                },
                {
                    text: "Lock It Link is NOT an AP game because:",
                    answers: [
                        "The graphics are too basic to track",
                        "It requires a player's card to activate",
                        "Its progressives hit randomly — no persistent state to exploit",
                        "The casino removes it before it hits"
                    ],
                    correct: 2,
                    explanation: "Lock It Link progressives are random-hit, not must-hit-by. There's no state that carries over between players, so there's nothing to spot or exploit."
                }
            ];

            var CHAT_LINKS = [
                { icon: '👽', name: 'r/AdvantagePlay', url: 'https://reddit.com/r/advantageplay', desc: 'Dedicated AP discussion — machine spotting, trip reports, and strategy.' },
                { icon: '🎰', name: 'r/Slots', url: 'https://reddit.com/r/Slots', desc: 'Large general slots community. AP threads are common and well-received.' },
                { icon: '🧙', name: 'Wizard of Vegas Forums', url: 'https://wizardofvegas.com/forum/', desc: 'Long-running gambling forum with serious AP math and machine discussion.' },
                { icon: '🎲', name: 'SlotFans Forum', url: 'https://www.slotfans.com/forum/', desc: 'Machine-specific threads, trip reports, and AP spotting tips.' },
                { icon: '📊', name: 'VPFree2', url: 'https://www.vpfree2.com/', desc: 'Casino payback data and AP-friendly property ratings by region.' }
            ];

            // ---------- State ----------
            var machinesData = null, machinesPromise = null, machinesError = null;
            var videosData = null, videosPromise = null, videosError = null;
            var searchQuery = '';
            var quizState = { currentQ: 0, userAnswers: [-1, -1, -1, -1, -1], finished: false };

            // ---------- Helpers ----------
            function escapeHtml(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function loadJSON(url) {
                return fetch(url, { cache: 'no-cache' }).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                });
            }

            function loadMachines() {
                if (machinesData) return Promise.resolve(machinesData);
                if (machinesPromise) return machinesPromise;
                machinesPromise = loadJSON('/machines.json').then(function (d) {
                    machinesData = d; machinesError = null; return d;
                }).catch(function (err) {
                    machinesError = err; machinesPromise = null; throw err;
                });
                return machinesPromise;
            }

            function loadVideos() {
                if (videosData) return Promise.resolve(videosData);
                if (videosPromise) return videosPromise;
                videosPromise = loadJSON('/videos.json').then(function (d) {
                    videosData = d; videosError = null; return d;
                }).catch(function (err) {
                    videosError = err; videosPromise = null; throw err;
                });
                return videosPromise;
            }

            function getCurrentTab() {
                var hash = (window.location.hash || '').replace(/^#/, '');
                return TABS.indexOf(hash) !== -1 ? hash : DEFAULT_TAB;
            }

            function setActiveTab(tab) {
                var links = document.querySelectorAll('.bottom-nav a');
                for (var i = 0; i < links.length; i++) {
                    var isActive = links[i].getAttribute('data-tab') === tab;
                    links[i].classList.toggle('active', isActive);
                    if (isActive) links[i].setAttribute('aria-current', 'page');
                    else links[i].removeAttribute('aria-current');
                }
            }

            // ---------- Render: Home ----------
            function renderHome() {
                return ''
                    + '<section class="view view-home">'
                    + '  <img src="/images/slotcheater-logo.png" alt="SlotCheater" class="home-logo" onerror="this.style.display=\'none\'">'
                    + '  <h1 class="home-headline">You found it!</h1>'
                    + '  <p class="home-body">'
                    +     "This is the <span style='color:#06B6D4;font-weight:600'>#1 resource</span> for learning <span style='color:#10B981;font-weight:600'>Advantage Play</span>, <span style='color:#8B5CF6;font-weight:600'>MHB</span>, <span style='color:#F59E0B;font-weight:600'>RTP slots</span> and <span style='color:#10B981;font-weight:600'>joining the winners!</span>"
                    + '  </p>'

                    + '  <div class="home-video-card">'
                    + '    <div class="home-video-header">Mikki Mase - Won $32Million Hustling!</div>'

                    + '      <div class="home-video-play" aria-hidden="true">▶</div>'
                    + '    </div>'
                    + '  </div>'
                    + '  <p class="home-video-caption">Mikki Mase - Won $32Million Hustling</p>'
                    + '  <p class="home-footer-note">Always gamble responsibly. AP is legal but requires practice and bankroll discipline.</p>'
                    + '</section>';
            }

            // ---------- Render: Cheats ----------
            function machineMatchesQuery(m, q) {
                if (!q) return true;
                var hay = (m.name + ' ' + (m.manufacturer || '') + ' ' + (m.apType || '')).toLowerCase();
                return hay.indexOf(q.toLowerCase()) !== -1;
            }

            function renderMachineCard(m) {
                var thumbHtml = m.thumb
                    ? '<img src="/' + escapeHtml(m.thumb) + '" alt="' + escapeHtml(m.name) + '" loading="lazy" onerror="var p=this.parentNode;p.innerHTML=\'🎰\';">'
                    : '🎰';
                return ''
                    + '<a class="machine-card" href="/hunter/' + escapeHtml(m.slug) + '/">'
                    + '  <div class="machine-thumb">' + thumbHtml + '</div>'
                    + '  <div class="machine-info">'
                    + '    <div class="machine-name">' + escapeHtml(m.name) + '</div>'
                    + '    <div class="machine-mfg">' + escapeHtml(m.manufacturer || '') + '</div>'
                    + '    <div class="machine-aptype">' + escapeHtml(m.apType || '') + '</div>'
                    + '  </div>'
                    + '  <div class="machine-chevron" aria-hidden="true">▼</div>'
                    + '</a>';
            }

            function renderCheatsList(query) {
                var items = machinesData.ap.slice().sort(function (a, b) {
                    return a.name.localeCompare(b.name);
                }).filter(function (m) { return machineMatchesQuery(m, query); });
                if (items.length === 0) {
                    return '<div class="cheats-empty">No machines match &ldquo;' + escapeHtml(query) + '&rdquo;.</div>';
                }
                return items.map(renderMachineCard).join('');
            }

            function renderCheats() {
                if (machinesError) {
                    return '<section class="view view-cheats"><div class="state-error">Failed to load machines. Please refresh.</div></section>';
                }
                if (!machinesData) {
                    return '<section class="view view-cheats"><div class="state-loading"><div class="spinner"></div><p>Loading cheat sheets…</p></div></section>';
                }
                return ''
                    + '<section class="view view-cheats">'
                    + '  <header class="cheats-header">'
                    + '    <img src="/images/slotcheater-logo.png" alt="SlotCheater" class="cheats-fox" onerror="this.style.display=\'none\'">'
                    + '    <div class="cheats-title-box">'
                    + '      <div class="cheats-title-line1">Advantage Play Slot Machines</div>'
                    + '      <div class="cheats-title-line2">Cheat Sheets</div>'
                    + '    </div>'
                    + '  </header>'
                    + '  <input id="cheats-search" class="cheats-search" type="search" placeholder="Search by name or type..." autocomplete="off" value="' + escapeHtml(searchQuery) + '">'
                    + '  <div id="cheats-list" class="cheats-list">' + renderCheatsList(searchQuery) + '</div>'
                    + '</section>';
            }

            function attachCheatsHandlers() {
                var input = document.getElementById('cheats-search');
                if (!input) return;
                input.addEventListener('input', function (e) {
                    searchQuery = e.target.value;
                    var list = document.getElementById('cheats-list');
                    if (list) list.innerHTML = renderCheatsList(searchQuery);
                });
            }

            // ---------- Render: Videos ----------
            function renderVideoCard(v) {
                var isPlaceholder = (v.url || '').indexOf('PLACEHOLDER') !== -1;
                var titleSuffix = isPlaceholder ? ' <span class="video-badge">coming soon</span>' : '';
                var inner = ''
                    + '<div class="video-thumb" aria-hidden="true">▶</div>'
                    + '<div class="video-info">'
                    + '  <div class="video-title">' + escapeHtml(v.title) + titleSuffix + '</div>'
                    + '  <div class="video-channel">' + escapeHtml(v.channel || '') + '</div>'
                    + '</div>';
                if (isPlaceholder) {
                    return '<div class="video-card" aria-disabled="true">' + inner + '</div>';
                }
                return '<a class="video-card" href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">' + inner + '</a>';
            }

            function renderVideos() {
                if (videosError) {
                    return '<section class="view view-videos"><div class="state-error">Failed to load videos. Please refresh.</div></section>';
                }
                if (!videosData) {
                    return '<section class="view view-videos"><div class="state-loading"><div class="spinner"></div><p>Loading videos…</p></div></section>';
                }
                var sections = (videosData.categories || []).map(function (cat) {
                    var cards = (cat.videos || []).map(renderVideoCard).join('');
                    return ''
                        + '<div class="video-section">'
                        + '  <div class="video-section-label">' + escapeHtml(cat.label) + '</div>'
                        + '  <div class="video-list">' + cards + '</div>'
                        + '</div>';
                }).join('');
                return ''
                    + '<section class="view view-videos">'
                    + '  <header class="videos-header">'
                    + '    <h1 class="videos-title">🎬 Video Library</h1>'
                    + '    <p class="videos-subtitle">Curated AP strategy videos — sorted by topic and machine</p>'
                    + '  </header>'
                    + sections
                    + '  <p class="videos-footer-note">More videos are being added to each individual cheat sheet page soon.</p>'
                    + '</section>';
            }

            // ---------- Render: Play (Quiz) ----------
            function renderQuizQuestion() {
                var qi = quizState.currentQ;
                var q = QUIZ_QUESTIONS[qi];
                var selected = quizState.userAnswers[qi];
                var answered = selected !== -1;
                var progressPct = ((answered ? qi + 1 : qi) / QUIZ_QUESTIONS.length) * 100;

                var answersHtml = q.answers.map(function (text, i) {
                    var cls = 'quiz-answer';
                    if (answered) {
                        if (i === q.correct) cls += ' correct';
                        else if (i === selected) cls += ' wrong';
                    }
                    var disabled = answered ? 'disabled' : '';
                    return '<button class="' + cls + '" data-idx="' + i + '" ' + disabled + '>' + escapeHtml(text) + '</button>';
                }).join('');

                var explanationHtml = answered
                    ? '<div class="quiz-explanation">' + escapeHtml(q.explanation) + '</div>'
                    : '';

                var nextHtml = answered
                    ? '<button id="quiz-next" class="quiz-next">' + (qi === QUIZ_QUESTIONS.length - 1 ? 'See Results →' : 'Next Question →') + '</button>'
                    : '';

                return ''
                    + '<div class="quiz-progress"><div class="quiz-progress-fill" style="width:' + progressPct + '%"></div></div>'
                    + '<div class="quiz-counter">Question ' + (qi + 1) + ' of ' + QUIZ_QUESTIONS.length + '</div>'
                    + '<h2 class="quiz-question">' + escapeHtml(q.text) + '</h2>'
                    + '<div class="quiz-answers">' + answersHtml + '</div>'
                    + explanationHtml
                    + nextHtml;
            }

            function renderQuizFinal() {
                var correctCount = quizState.userAnswers.reduce(function (acc, ans, i) {
                    return acc + (ans === QUIZ_QUESTIONS[i].correct ? 1 : 0);
                }, 0);
                var total = QUIZ_QUESTIONS.length;
                var color = correctCount >= 4 ? '#10B981' : (correctCount >= 2 ? '#F59E0B' : '#EF4444');
                var msg;
                if (correctCount === 5) msg = "You're a certified Slot Hustler! 🎰";
                else if (correctCount >= 3) msg = 'Solid knowledge — keep studying the cheat sheets!';
                else msg = 'Head to the Cheats tab and study up!';

                return ''
                    + '<div class="quiz-final">'
                    + '  <div class="quiz-final-score" style="color:' + color + '">You got ' + correctCount + '/' + total + ' correct!</div>'
                    + '  <p class="quiz-final-message">' + escapeHtml(msg) + '</p>'
                    + '  <button id="quiz-restart" class="quiz-restart">Play Again</button>'
                    + '</div>';
            }

            function renderPlay() {
                var inner = quizState.finished ? renderQuizFinal() : renderQuizQuestion();
                return ''
                    + '<section class="view view-play">'
                    + '  <header class="quiz-header">'
                    + '    <h1 class="quiz-title">🎮 AP Spotter Quiz</h1>'
                    + '    <p class="quiz-subtitle">Test your advantage play knowledge</p>'
                    + '  </header>'
                    +    inner
                    + '</section>';
            }

            function attachQuizHandlers() {
                var answers = document.querySelectorAll('.quiz-answer');
                for (var i = 0; i < answers.length; i++) {
                    answers[i].addEventListener('click', function (e) {
                        var idx = parseInt(this.getAttribute('data-idx'), 10);
                        if (quizState.userAnswers[quizState.currentQ] !== -1) return;
                        quizState.userAnswers[quizState.currentQ] = idx;
                        render();
                    });
                }
                var next = document.getElementById('quiz-next');
                if (next) {
                    next.addEventListener('click', function () {
                        if (quizState.currentQ < QUIZ_QUESTIONS.length - 1) {
                            quizState.currentQ++;
                        } else {
                            quizState.finished = true;
                        }
                        render();
                    });
                }
                var restart = document.getElementById('quiz-restart');
                if (restart) {
                    restart.addEventListener('click', function () {
                        quizState = { currentQ: 0, userAnswers: [-1, -1, -1, -1, -1], finished: false };
                        render();
                    });
                }
            }

            // ---------- Render: Chat ----------
            function renderChat() {
                var cards = CHAT_LINKS.map(function (l) {
                    return ''
                        + '<a class="chat-card" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">'
                        + '  <div class="chat-icon" aria-hidden="true">' + escapeHtml(l.icon) + '</div>'
                        + '  <div class="chat-info">'
                        + '    <div class="chat-name">' + escapeHtml(l.name) + '</div>'
                        + '    <div class="chat-desc">' + escapeHtml(l.desc) + '</div>'
                        + '  </div>'
                        + '  <div class="chat-arrow" aria-hidden="true">→</div>'
                        + '</a>';
                }).join('');
                return ''
                    + '<section class="view view-chat">'
                    + '  <header class="chat-header">'
                    + '    <h1 class="chat-title">💬 Community</h1>'
                    + '    <p class="chat-subtitle">Connect with other AP players. Find your crew.</p>'
                    + '  </header>'
                    + '  <div class="chat-list">' + cards + '</div>'
                    + '  <p class="chat-footer-note">Know a great AP community we missed? Email us: hello@slotcheater.com</p>'
                    + '  <!-- FUTURE: SlotCheater live community chat will appear at the top of this list when launched -->'
                    + '</section>';
            }

            // ---------- Main render ----------
            function render() {
                var tab = getCurrentTab();
                var app = document.getElementById('app');
                setActiveTab(tab);

                if (tab === 'home') {
                    app.innerHTML = renderHome();
                } else if (tab === 'cheats') {
                    if (!machinesData && !machinesError) {
                        app.innerHTML = '<section class="view"><div class="state-loading"><div class="spinner"></div><p>Loading cheat sheets…</p></div></section>';
                        loadMachines().then(render).catch(function () { render(); });
                        return;
                    }
                    app.innerHTML = renderCheats();
                    attachCheatsHandlers();
                } else if (tab === 'videos') {
                    if (!videosData && !videosError) {
                        app.innerHTML = '<section class="view"><div class="state-loading"><div class="spinner"></div><p>Loading videos…</p></div></section>';
                        loadVideos().then(render).catch(function () { render(); });
                        return;
                    }
                    app.innerHTML = renderVideos();
                } else if (tab === 'play') {
                    app.innerHTML = renderPlay();
                    attachQuizHandlers();
                } else if (tab === 'chat') {
                    app.innerHTML = renderChat();
                }

                window.scrollTo(0, 0);
            }

            // ---------- Init ----------
            if (!window.location.hash) {
                history.replaceState(null, '', '#' + DEFAULT_TAB);
            }
            window.addEventListener('hashchange', render);
            render();
        })();
    </script>

    <!-- Service Worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () { /* ignore */ });
            });
        }
    </script>
</body>
</html>
