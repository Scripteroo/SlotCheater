                if (items.length === 0) {
                    return '<div class="cheats-empty">No machines match &ldquo;' + escapeHtml(query) + '&rdquo;.</div>';
                }
                return items.map(renderMachineCard).join('');
            }

            function renderNotApCard(m) {
                var thumbHtml = m.thumb
                    ? '<img src="./' + escapeHtml(m.thumb) + '" alt="' + escapeHtml(m.name) + '" loading="lazy" onerror="var p=this.parentNode;p.innerHTML=\'🚫\';">'
                    : '🚫';
                return ''
                    + '<div class="machine-card machine-card-not-ap">'
                    + '  <div class="machine-card-top">'
                    + '    <div class="machine-thumb">' + thumbHtml + '</div>'
                    + '    <div class="machine-info">'
                    + '      <div class="machine-name">' + escapeHtml(m.name) + '</div>'
                    + '      <div class="machine-mfg">' + escapeHtml(m.manufacturer || '') + '</div>'
                    + '      <div class="machine-not-ap-reason">' + escapeHtml(m.reason || '') + '</div>'
                    + '    </div>'
                    + '    <span class="not-ap-badge">🚫 NOT AP</span>'
                    + '  </div>'
                    + '</div>';
            }

            function renderNotApSection() {
                if (!machinesData || !machinesData.notAp || machinesData.notAp.length === 0) return '';
                var items = machinesData.notAp.slice().sort(function (a, b) {
                    return a.name.localeCompare(b.name);
                });
                var cards = items.map(renderNotApCard).join('');
                return ''
                    + '<div class="cheats-section-header">'
                    + '<h2 class="cheats-section-title">⚠️ Not Advantage Play</h2>'
                    + '<p class="cheats-section-sub">These machines are commonly mistaken for AP opportunities but have no confirmed edge.</p>'
                    + '</div>'
                    + '<div class="cheats-list">' + cards + '</div>';
            }

            function renderCheats() {
                if (machinesError) {
                    return '<section class="view view-cheats"><div class="state-error">Failed to load machines. Please refresh.</div></section>';
                }
                if (!machinesData) {
                    return '<section class="view view-cheats"><div class="state-loading"><div class="spinner"></div><p>Loading cheat sheets…</p></div></section>';
                }
                return ''
                    + '<section class="view view-cheats">'
                    + '  <header class="cheats-header">'
                    + '    <img src="./images/slotcheater-logo.png" alt="SlotCheater" class="cheats-fox" onerror="this.style.display=\'none\'">'
                    + '    <div class="cheats-title-box">'
                    + '      <div class="cheats-title-line1">Advantage Play Slot Machines</div>'
                    + '      <div class="cheats-title-line2">Cheat Sheets</div>'
                    + '    </div>'
                    + '  </header>'
                    + '  <input id="cheats-search" class="cheats-search" type="search" placeholder="Search by name or type..." autocomplete="off" value="' + escapeHtml(searchQuery) + '">'
                    + '  <div id="cheats-list" class="cheats-list">' + renderCheatsList(searchQuery) + '</div>'
                    + '  <div id="not-ap-section"' + (searchQuery ? ' style="display:none"' : '') + '>'
                    +      renderNotApSection()
                    + '  </div>'
                    + '<div class="cheats-footer">'
                    + '<p class="cheats-footer-note">New cheat sheets added regularly. '
                    + 'Always gamble responsibly — AP is legal but requires practice '
                    + 'and bankroll discipline.</p>'
                    + '<p class="cheats-footer-sub">SlotCheater.com · For educational '
                    + 'purposes only</p>'
                    + '</div>'
                    + '</section>';
            }

            function attachCheatsHandlers() {
                var input = document.getElementById('cheats-search');
                var list = document.getElementById('cheats-list');
                if (input) {
                    input.addEventListener('input', function (e) {
                        searchQuery = e.target.value;
                        if (list) list.innerHTML = renderCheatsList(searchQuery);
                        var notAp = document.getElementById('not-ap-section');
                        if (notAp) notAp.style.display = searchQuery ? 'none' : '';
                    });
                }
                if (list) {
                    list.addEventListener('click', function (e) {
                        var t = e.target;
                        var btn = t && t.closest ? t.closest('.machine-info-btn') : null;
                        if (!btn) return;
                        e.preventDefault();
                        var card = btn.closest('.machine-card');
                        if (!card) return;
                        var hint = card.querySelector('.machine-hint');
                        var expanded = btn.getAttribute('aria-expanded') === 'true';
                        btn.setAttribute('aria-expanded', expanded ? 'false' : 'true');
                        if (hint) hint.classList.toggle('open');
                    });
                }
            }

            // ---------- Render: Videos ----------
            function renderVideoCard(v) {
                var isPlaceholder = (v.url || '').indexOf('PLACEHOLDER') !== -1;
                var titleSuffix = isPlaceholder ? ' <span class="video-badge">coming soon</span>' : '';
                var inner = ''
                    + '<div class="video-thumb" aria-hidden="true">▶</div>'
                    + '<div class="video-info">'
                    + '  <div class="video-title">' + escapeHtml(v.title) + titleSuffix + '</div>'
                    + '  <div class="video-channel">' + escapeHtml(v.channel || '') + '</div>'
                    + '</div>';
                if (isPlaceholder) {
                    return '<div class="video-card" aria-disabled="true">' + inner + '</div>';
                }
                return '<a class="video-card" href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">' + inner + '</a>';
            }

            function renderVideos() {
              fetch('videos.json')
                .then(r => r.json())
                .then(videos => {
                  const section = document.getElementById('videos');
                  if (!section) return;

                  const categories = [
                    { id: 'all',            label: 'All' },
                    { id: 'advantage-play', label: 'Advantage Play' },
                    { id: 'progressives',   label: 'Progressives' },
                    { id: 'strategy',       label: 'Strategy' },
                    { id: 'beginner-tips',  label: 'Beginner Tips' },
                    { id: 'hustling',       label: 'Hustling' }
                  ];

                  let activeFilter = 'all';

                  function getFiltered() {
                    return activeFilter === 'all' ? videos : videos.filter(v => v.category === activeFilter);
                  }

                  function renderGrid() {
                    const filtered = getFiltered();
                    grid.innerHTML = filtered.map(v => `
                      <a class="vid-card" href="https://www.youtube.com/watch?v=${v.youtubeId}" target="_blank" rel="noopener">
                        <div class="vid-thumb-wrap">
                          <img class="vid-thumb" src="https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg" alt="${v.title}" loading="lazy">
                          <div class="vid-play-btn">▶</div>
                        </div>
                        <div class="vid-info">
                          <span class="vid-cat-badge vid-cat-${v.category}">${categories.find(c=>c.id===v.category)?.label||v.category}</span>
                          <p class="vid-title">${v.title}</p>
                          <p class="vid-channel">${v.channel}</p>
                        </div>
                      </a>
                    `).join('');
                  }

                  section.innerHTML = `<div class="videos-inner"></div>`;
                  const inner = section.querySelector('.videos-inner');

                  inner.innerHTML = `
                    <div class="vid-pills" id="vid-pills"></div>
                    <div class="vid-grid" id="vid-grid"></div>
                  `;

                  const pillsEl = inner.querySelector('#vid-pills');
                  const grid = inner.querySelector('#vid-grid');

                  function renderPills() {
                    pillsEl.innerHTML = categories.map(c => `
                      <button class="vid-pill ${c.id === activeFilter ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>
                    `).join('');
                    pillsEl.querySelectorAll('.vid-pill').forEach(btn => {
                      btn.addEventListener('click', () => {
                        activeFilter = btn.dataset.cat;
                        renderPills();
                        renderGrid();
                      });
                    });
                  }

                  renderPills();
                  renderGrid();
                });
            }

            // ---------- Render: Play (Quiz) ----------
            function renderQuizQuestion() {
                var qi = quizState.currentQ;
                var q = QUIZ_QUESTIONS[qi];
                var selected = quizState.userAnswers[qi];
                var answered = selected !== -1;
                var progressPct = ((answered ? qi + 1 : qi) / QUIZ_QUESTIONS.length) * 100;

                var answersHtml = q.answers.map(function (text, i) {
                    var cls = 'quiz-answer';
                    if (answered) {
                        if (i === q.correct) cls += ' correct';
                        else if (i === selected) cls += ' wrong';
                    }
                    var disabled = answered ? 'disabled' : '';
                    return '<button class="' + cls + '" data-idx="' + i + '" ' + disabled + '>' + escapeHtml(text) + '</button>';
                }).join('');

                var explanationHtml = answered
                    ? '<div class="quiz-explanation">' + escapeHtml(q.explanation) + '</div>'
                    : '';

                var nextHtml = answered
                    ? '<button id="quiz-next" class="quiz-next">' + (qi === QUIZ_QUESTIONS.length - 1 ? 'See Results →' : 'Next Question →') + '</button>'
                    : '';

                return ''
                    + '<div class="quiz-progress"><div class="quiz-progress-fill" style="width:' + progressPct + '%"></div></div>'
                    + '<div class="quiz-counter">Question ' + (qi + 1) + ' of ' + QUIZ_QUESTIONS.length + '</div>'
                    + '<h2 class="quiz-question">' + escapeHtml(q.text) + '</h2>'
                    + '<div class="quiz-answers">' + answersHtml + '</div>'
                    + explanationHtml
                    + nextHtml;
            }

            function renderQuizFinal() {
                var correctCount = quizState.userAnswers.reduce(function (acc, ans, i) {
                    return acc + (ans === QUIZ_QUESTIONS[i].correct ? 1 : 0);
                }, 0);
                var total = QUIZ_QUESTIONS.length;
                var color = correctCount >= 4 ? '#10B981' : (correctCount >= 2 ? '#F59E0B' : '#EF4444');
                var msg;
                if (correctCount === 5) msg = "You're a certified Slot Hustler! 🎰";
                else if (correctCount >= 3) msg = 'Solid knowledge — keep studying the cheat sheets!';
                else msg = 'Head to the Cheats tab and study up!';

                return ''
                    + '<div class="quiz-final">'
                    + '  <div class="quiz-final-score" style="color:' + color + '">You got ' + correctCount + '/' + total + ' correct!</div>'
                    + '  <p class="quiz-final-message">' + escapeHtml(msg) + '</p>'
                    + '  <button id="quiz-restart" class="quiz-restart">Play Again</button>'
                    + '</div>';
            }

            function renderPlay() {
                var inner = quizState.finished ? renderQuizFinal() : renderQuizQuestion();
                return ''
                    + '<section class="view view-play">'
                    + '  <header class="quiz-header">'
                    + '    <h1 class="quiz-title">🎮 AP Spotter Quiz</h1>'
                    + '    <p class="quiz-subtitle">Test your advantage play knowledge</p>'
                    + '  </header>'
                    +    inner
                    + '</section>';
            }

            function attachQuizHandlers() {
                var answers = document.querySelectorAll('.quiz-answer');
                for (var i = 0; i < answers.length; i++) {
                    answers[i].addEventListener('click', function (e) {
                        var idx = parseInt(this.getAttribute('data-idx'), 10);
                        if (quizState.userAnswers[quizState.currentQ] !== -1) return;
                        quizState.userAnswers[quizState.currentQ] = idx;
                        render();
                    });
                }
                var next = document.getElementById('quiz-next');
                if (next) {
                    next.addEventListener('click', function () {
                        if (quizState.currentQ < QUIZ_QUESTIONS.length - 1) {
                            quizState.currentQ++;
                        } else {
                            quizState.finished = true;
                        }
                        render();
                    });
                }
                var restart = document.getElementById('quiz-restart');
                if (restart) {
                    restart.addEventListener('click', function () {
                        quizState = { currentQ: 0, userAnswers: [-1, -1, -1, -1, -1], finished: false };
                        render();
                    });
                }
            }

            // ---------- Render: Chat ----------
            function renderChat() {
                var cards = CHAT_LINKS.map(function (l) {
                    return ''
                        + '<a class="chat-card" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">'
                        + '  <div class="chat-icon" aria-hidden="true">' + escapeHtml(l.icon) + '</div>'
                        + '  <div class="chat-info">'
                        + '    <div class="chat-name">' + escapeHtml(l.name) + '</div>'
                        + '    <div class="chat-desc">' + escapeHtml(l.desc) + '</div>'
                        + '  </div>'
                        + '  <div class="chat-arrow" aria-hidden="true">→</div>'
                        + '</a>';
                }).join('');
                return ''
                    + '<section class="view view-chat">'
                    + '  <header class="chat-header">'
                    + '    <h1 class="chat-title">💬 Community</h1>'
                    + '    <p class="chat-subtitle">Connect with other AP players. Find your crew.</p>'
                    + '  </header>'
                    + '  <div class="chat-list">' + cards + '</div>'
                    + '  <p class="chat-footer-note">Know a great AP community we missed? Email us: hello@slotcheater.com</p>'
                    + '  <!-- FUTURE: SlotCheater live community chat will appear at the top of this list when launched -->'
                    + '</section>';
            }

            // ---------- Main render ----------
            function render() {
                var tab = getCurrentTab();
                var app = document.getElementById('app');
                setActiveTab(tab);

                if (tab === 'home') {
                    app.innerHTML = renderHome();
                    attachHomeHandlers();
                } else if (tab === 'cheats') {
                    if (!machinesData && !machinesError) {
                        app.innerHTML = '<section class="view"><div class="state-loading"><div class="spinner"></div><p>Loading cheat sheets…</p></div></section>';
                        loadMachines().then(render).catch(function () { render(); });
                        return;
                    }
                    app.innerHTML = renderCheats();
                    attachCheatsHandlers();
                } else if (tab === 'videos') {
                    app.innerHTML = '<section id="videos" class="view"><div class="state-loading"><div class="spinner"></div><p>Loading videos…</p></div></section>';
                    renderVideos();
                } else if (tab === 'play') {
                    app.innerHTML = renderPlay();
                    attachQuizHandlers();
                } else if (tab === 'chat') {
                    app.innerHTML = renderChat();
                }

                window.scrollTo(0, 0);
            }

            // ---------- Init ----------
            // Capture beforeinstallprompt for the Save-as-App button
            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                window.deferredPrompt = e;
            });

            if (!window.location.hash) {
                history.replaceState(null, '', '#' + DEFAULT_TAB);
            }
            window.addEventListener('hashchange', render);
            render();

            // Loading overlay dismissal: whichever fires first
            var loadingDismissed = false;
            function dismissLoading() {
                if (loadingDismissed) return;
                loadingDismissed = true;
                var overlay = document.getElementById('loading-overlay');
                if (!overlay) return;
                overlay.classList.add('hidden');
                setTimeout(function () { overlay.style.display = 'none'; }, 400);
            }
            setTimeout(dismissLoading, 3000);
            loadMachines().then(dismissLoading, dismissLoading);

            // ---------- Top controls: info modal + share ----------
            var toastTimer = null;
            function showToast(msg) {
                var t = document.getElementById('toast');
                if (!t) return;
                t.textContent = msg;
                t.hidden = false;
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () { t.hidden = true; }, 2000);
            }
            function openInfoModal() {
                var m = document.getElementById('info-modal');
                if (!m) return;
                m.hidden = false;
                m.setAttribute('aria-hidden', 'false');
            }
            function closeInfoModal() {
                var m = document.getElementById('info-modal');
                if (!m) return;
                m.hidden = true;
                m.setAttribute('aria-hidden', 'true');
            }
            function shareApp() {
                var url = 'https://slotcheater.com/';
                var payload = { title: 'SlotCheater', text: 'The #1 resource for Slot Hustling & Advantage Play', url: url };
                if (navigator.share && typeof navigator.share === 'function') {
                    navigator.share(payload).catch(function () { /* user cancelled or failed */ });
                    return;
                }
                if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                    navigator.clipboard.writeText(url).then(function () { showToast('Copied!'); }, function () { showToast('Copy failed'); });
                    return;
                }
                showToast(url);
            }
            function triggerInstall() {
                if (window.deferredPrompt && typeof window.deferredPrompt.prompt === 'function') {
                    window.deferredPrompt.prompt();
                    if (window.deferredPrompt.userChoice && typeof window.deferredPrompt.userChoice.then === 'function') {
                        window.deferredPrompt.userChoice.then(function () { window.deferredPrompt = null; });
                    }
                    return;
                }
                if (navigator.share && typeof navigator.share === 'function') {
                    navigator.share({
                        title: 'SlotCheater',
                        text: 'Add SlotCheater to your Home Screen for instant access!',
                        url: 'https://slotcheater.com'
                    }).catch(function () { showToast('Tap Share then Add to Home Screen'); });
                    return;
                }
                showToast('Tap Share then Add to Home Screen');
            }
            var topBarMenu = document.getElementById('top-bar-menu');
            var topBarShare = document.getElementById('top-bar-share');
            var topBarInstall = document.getElementById('top-bar-install');
            var infoClose = document.getElementById('info-modal-close');
            var infoBackdrop = document.getElementById('info-modal-backdrop');
            if (topBarMenu) topBarMenu.addEventListener('click', openInfoModal);
            if (topBarShare) topBarShare.addEventListener('click', shareApp);
            if (topBarInstall) topBarInstall.addEventListener('click', triggerInstall);
            if (infoClose) infoClose.addEventListener('click', closeInfoModal);
            if (infoBackdrop) infoBackdrop.addEventListener('click', closeInfoModal);
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeInfoModal();
            });
        })();
    </script>

    <!-- Service Worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                  for(let registration of registrations) {
                    registration.unregister();
                  }
                });
                navigator.serviceWorker.register('./sw.js').catch(function () { /* ignore */ });
            });
        }
    </script>
</body>
</html>
